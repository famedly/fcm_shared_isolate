name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    permissions:
      contents: read
    uses: famedly/frontend-ci-templates/.github/workflows/dart.yml@v1.3.1
    with:
      env_file: ".github/workflows/versions.env"

  pub-dev-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: famedly/frontend-ci-templates/.github/actions/setup-flutter@v1.3.1
        with:
          flutter-version: ${{ env.flutter_version }}
      - name: pub.dev publish dry run
        run: |
          flutter pub get
          flutter pub publish --dry-run

  # Call the publish workflow only when all checks pass and this is a tag push
  call_publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dart, pub-dev-dry-run]
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
